server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nunca listar directorios: un listado deshabilitado sobre una ruta que no
    # existe es justamente lo que hace que nginx responda 403 en vez de servir
    # la aplicación.
    autoindex off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # ── Rutas de la SPA ──────────────────────────────────────────────────────
    # La app usa Vue Router en modo history: /login, /dashboard, /seguimiento…
    # no existen como archivos. Al recargar, el navegador pide esa ruta al
    # servidor y hay que devolverle siempre index.html.
    #
    # Se usa `try_files $uri /index.html` (SIN el `$uri/` habitual) a propósito:
    # `$uri/` hace que nginx intente resolver la ruta como directorio y, si
    # coincide con uno sin index, devuelve 403 Forbidden. En una SPA no se
    # sirven directorios, así que ese paso solo puede causar problemas.
    location / {
        try_files $uri /index.html;

        # Red de seguridad: si aun así algo devolviera 403 o 404 en una ruta de
        # navegación, se entrega la SPA en lugar de la página de error de nginx.
        # Solo aplica a este location, así que los assets siguen dando 404 real.
        error_page 403 404 = /index.html;
    }

    # ── Assets estáticos ─────────────────────────────────────────────────────
    # Los nombres llevan hash, por eso se pueden cachear de forma agresiva.
    # `try_files ... =404` evita que un asset inexistente caiga en el manejo de
    # directorios (otra vía por la que aparecería un 403).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # index.html no debe cachearse: si el navegador conserva uno viejo seguirá
    # pidiendo bundles que ya no existen después de un despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
